services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_photo_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [hotel_photo_pg:/var/lib/postgresql/data]
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres]
volumes:
  hotel_photo_pg:
