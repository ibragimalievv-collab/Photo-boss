<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Photo Boss · Ваша оценка</title><link rel="stylesheet" href="/app/css/styles.css"><script type="module" src="/app/js/feedback.js"></script><body><main class="content"><h1>Как прошла съёмка?</h1><p>Ваша оценка поможет команде Photo Boss улучшить сервис.</p><form id="feedbackForm" class="panel form-grid"><label class="field">Оценка<select class="input" name="rating" required><option value="">Выберите</option><option value="5">5 — отлично</option><option value="4">4 — хорошо</option><option value="3">3 — нормально</option><option value="2">2 — плохо</option><option value="1">1 — очень плохо</option></select></label><label class="field">Короткий отзыв<textarea class="input" name="comment" maxlength="1000"></textarea></label><button class="btn primary">Отправить</button></form><p id="feedbackResult" role="status"></p></main></body></html>
