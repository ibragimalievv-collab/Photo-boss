name: Schedule text import checks
on:
  push:
    branches: ['feat/schedule-text-import-20261024']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o photo-boss-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: photo-boss-schedule-source
          path: photo-boss-source.zip
          retention-days: 1
