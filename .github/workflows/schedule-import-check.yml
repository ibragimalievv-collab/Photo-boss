name: Schedule text import checks
on:
  push:
    branches: ['feat/schedule-text-import-20261024']
permissions:
  contents: read
jobs:
  verification-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          pip wheel -r requirements-dev.txt --wheel-dir wheels
      - uses: actions/upload-artifact@v4
        with:
          name: photo-boss-test-wheels
          path: wheels
          retention-days: 1
