name: Mini App release

on:
  push:
    branches: [main, 'release/miniapp-v3-integration']
  pull_request:
    paths: ['app/**', 'tests/**', '.github/workflows/miniapp-release.yml']

permissions:
  contents: read

concurrency:
  group: miniapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: miniapp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U ci -d miniapp_ci'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOT_TOKEN: 123456:CI_ONLY_DO_NOT_USE_FOR_TELEGRAM
      ADMIN_TELEGRAM_IDS: '5000000001'
      MINIAPP_TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@127.0.0.1:5432/miniapp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Actual release syntax and server tests
        run: |
          mkdir -p qa-release
          python -m compileall -q app tests
          for file in app/webapp/js/*.js; do node --check "$file"; done
          python -m pytest -q tests/test_miniapp_release.py | tee qa-release/server-tests.txt
      - name: Mobile and desktop UI checks with no external requests
        run: python tests/miniapp_browser_check.py
      - name: Save exact tested source without secrets
        if: always()
        run: |
          mkdir -p qa-release
          git rev-parse HEAD > qa-release/commit.txt
          git archive --format=zip HEAD > qa-release/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miniapp-release-qa
          path: qa-release/
          retention-days: 7
