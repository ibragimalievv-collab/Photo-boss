name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: 123456:CI_ONLY_DO_NOT_USE_FOR_TELEGRAM
      ADMIN_TELEGRAM_IDS: "5000000001"
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      MANAGER_PERCENT: "16"
      PHOTOGRAPHER_PERCENT: "11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - name: Verify the current Render Python runtime
        run: |
          python -m pip check
          python -m pytest -q

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: 123456:CI_ONLY_DO_NOT_USE_FOR_TELEGRAM
      ADMIN_TELEGRAM_IDS: "5000000001"
      POSTGRES_PASSWORD: ci-only-password
      MANAGER_PERCENT: "16"
      PHOTOGRAPHER_PERCENT: "11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install and verify dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          pip-audit -r requirements.txt

      - name: Build and start the complete Docker stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet
          compose="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          if ! $compose up -d --build --wait --wait-timeout 120; then
            $compose ps || true
            $compose logs --tail=200 bot postgres || true
            exit 1
          fi

      - name: Static and regression checks
        run: |
          python -m compileall -q app tests
          ruff check app tests
          node --check app/attendance_ui/attendance.js
          node --check app/work_chat_ui/chat.js
          node --check app/work_chat_ui/calls.js
          node --check app/work_chat_ui/ringtone.js
          node --check app/work_chat_ui/recorder.js
          node --check app/work_chat_ui/ui.js
          node --check app/work_chat_ui/camera.js
          node --check app/webapp/js/practice.js
          for file in app/webapp/js/*.js; do node --check "$file"; done
          DATABASE_URL='sqlite+aiosqlite:///:memory:' python -m pytest -q

      - name: Verify PostgreSQL, bot health and restart count
        run: |
          compose="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          $compose exec -T bot python -m app.smoke
          sleep 15
          bot_id="$($compose ps -q bot)"
          test "$(docker inspect -f '{{.State.Status}}' "$bot_id")" = running
          test "$(docker inspect -f '{{.State.Health.Status}}' "$bot_id")" = healthy
          test "$(docker inspect -f '{{.RestartCount}}' "$bot_id")" = 0
          $compose ps
          $compose logs --tail=100 bot postgres

      - name: Verify additive migrations and audit on PostgreSQL
        env:
          PYTHONPATH: .
          UPDATE_POSTGRES_TEST_URL: postgresql+asyncpg://postgres:ci-only-password@127.0.0.1:5432/hotel_photo_bot
        run: python tests/update_postgres_check.py

      - name: Stop test stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
          fi

  calls-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      PYTHONPATH: .
      CALLS_QA_DIR: /tmp/photo-boss-calls-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify camera grant reuse, controls and permission denial
        env:
          CALLS_QA_CONTROLS_ONLY: '1'
        run: python tests/work_calls_browser_check.py
      - name: Verify real audio and video between three fixture clients
        run: python tests/work_calls_browser_check.py
      - name: Verify Academy uploads and owner review inside the app
        run: python tests/academy_practice_browser_check.py
      - name: Verify new mobile screens and offline replay
        run: python tests/update_browser_check.py
      - name: Verify cold offline start and replay of sales with photos
        env:
          WORKFLOW_TEST_CERT: /tmp/photo-boss-test-cert.pem
          WORKFLOW_TEST_KEY: /tmp/photo-boss-test-key.pem
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$WORKFLOW_TEST_KEY" -out "$WORKFLOW_TEST_CERT" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1' 2>/dev/null
          python tests/workflow_browser_check.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calls-browser-evidence
          path: /tmp/photo-boss-calls-qa

  turn-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      PYTHONPATH: .
      CALLS_QA_DIR: /tmp/photo-boss-turn-qa
      CALLS_QA_RELAY_ONLY: '1'
      CALLS_TURN_URLS: 'turn:127.0.0.1:13478?transport=udp,turn:127.0.0.1:13478?transport=tcp'
      CALLS_TURN_SECRET: ci-only-turn-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Start an isolated test relay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coturn
          turnserver -n --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 --listening-port=13478 --realm=photo-boss-ci --use-auth-secret --static-auth-secret=ci-only-turn-secret --no-tls --no-dtls --no-cli --allow-loopback-peers --no-multicast-peers --min-port=49160 --max-port=49260 --pidfile=/tmp/photoboss-coturn.pid --log-file=/tmp/photoboss-coturn.log -o
      - name: Verify audio and video through the relay without direct connections
        run: python tests/work_calls_browser_check.py
      - name: Show test relay diagnostics on failure
        if: failure()
        run: tail -120 /tmp/photoboss-coturn*.log
