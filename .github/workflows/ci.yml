name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: 123456:CI_ONLY_DO_NOT_USE_FOR_TELEGRAM
      ADMIN_TELEGRAM_IDS: "5000000001"
      POSTGRES_PASSWORD: ci-only-password
      MANAGER_PERCENT: "16"
      PHOTOGRAPHER_PERCENT: "11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install and verify dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          pip-audit -r requirements.txt

      - name: Build and start the complete Docker stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet
          compose="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          if ! $compose up -d --build --wait --wait-timeout 120; then
            $compose ps || true
            $compose logs --tail=200 bot postgres || true
            exit 1
          fi

      - name: Static and regression checks
        run: |
          python -m compileall -q app tests
          ruff check app tests
          node --check app/attendance_ui/attendance.js
          node --check app/work_chat_ui/chat.js
          node --check app/work_chat_ui/calls.js
          node --check app/work_chat_ui/ringtone.js
          DATABASE_URL='sqlite+aiosqlite:///:memory:' python -m pytest -q

      - name: Verify PostgreSQL, bot health and restart count
        run: |
          compose="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          $compose exec -T bot python -m app.smoke
          sleep 15
          bot_id="$($compose ps -q bot)"
          test "$(docker inspect -f '{{.State.Status}}' "$bot_id")" = running
          test "$(docker inspect -f '{{.State.Health.Status}}' "$bot_id")" = healthy
          test "$(docker inspect -f '{{.RestartCount}}' "$bot_id")" = 0
          $compose ps
          $compose logs --tail=100 bot postgres

      - name: Stop test stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
          fi

  calls-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      PYTHONPATH: .
      CALLS_QA_DIR: /tmp/photo-boss-calls-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify real audio and video between three fixture clients
        run: python tests/work_calls_browser_check.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calls-browser-evidence
          path: /tmp/photo-boss-calls-qa

  public-turn-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # An external public relay is tested before production configuration is changed.
    # Its availability must not block unrelated application/security updates.
    continue-on-error: true
    env:
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      PYTHONPATH: .
      CALLS_QA_DIR: /tmp/photo-boss-turn-qa
      CALLS_QA_RELAY_ONLY: '1'
      CALLS_TURN_URLS: 'turn:staticauth.openrelay.metered.ca:80?transport=udp,turn:staticauth.openrelay.metered.ca:443?transport=tcp,turns:staticauth.openrelay.metered.ca:443?transport=tcp'
      # Public test credential explicitly published by the Open Relay provider.
      # https://www.metered.ca/tools/openrelay/#-static-auth
      CALLS_TURN_SECRET: openrelayprojectsecret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify audio and video through the relay without direct connections
        run: python tests/work_calls_browser_check.py
