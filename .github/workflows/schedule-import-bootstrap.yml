name: Prepare verified schedule feature
on:
  push:
    branches: ['feat/schedule-text-import-20261024']
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: schedule_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d schedule_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOT_TOKEN: 123456:CI_ONLY_DO_NOT_USE_FOR_TELEGRAM
      ADMIN_TELEGRAM_IDS: '5000000001'
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      UPDATE_POSTGRES_TEST_URL: 'postgresql+asyncpg://test:test@127.0.0.1:5432/schedule_test'
      PYTHONPATH: .
      SCHEDULE_QA_DIR: schedule-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply checksum-verified implementation patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          parts = sorted(Path('.github/schedule-text-patch').glob('*.b64'))
          assert len(parts) == 5
          data = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(data).hexdigest() == '7aa9fa2b5b75dbb6abe8e67047f69b8654ec339cc623c6d450385f28ffc997f6'
          Path('/tmp/schedule-import.patch').write_bytes(data)
          PY
          git apply --check /tmp/schedule-import.patch
          git apply /tmp/schedule-import.patch
          git apply --check .github/schedule-import-fixes.patch
          git apply .github/schedule-import-fixes.patch
      - run: pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Parser, permissions, preservation and rollback regression
        run: |
          ruff check app tests
          python -m pytest -q tests/test_schedule_text_import.py tests/test_schedule_batch.py tests/test_miniapp_release.py tests/test_work_history_reset_startup.py
          for f in app/webapp/js/schedule-import.js app/webapp/js/schedule-editor.js app/webapp/js/app.js app/webapp/sw.js; do node --check "$f"; done
      - name: PostgreSQL concurrent import verification
        run: python tests/schedule_text_postgres_check.py
      - name: Desktop and narrow mobile browser verification
        run: python tests/schedule_text_browser_check.py
      - name: Commit verified implementation to feature branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/schedule-text-import-20261024'
          rm -rf .github/schedule-text-patch
          rm .github/schedule-import-fixes.patch .github/workflows/schedule-import-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests docs/schedule-text-import.md .github/schedule-text-patch .github/schedule-import-fixes.patch .github/workflows/schedule-import-bootstrap.yml
          git commit -m 'Implement atomic schedule text import with daily roles and verified replay'
          git push origin HEAD:refs/heads/feat/schedule-text-import-20261024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-browser-evidence
          path: schedule-qa
          retention-days: 7
