name: Work chat UI
on:
  pull_request:
    paths:
      - 'app/work_chat.py'
      - 'app/work_rules.py'
      - 'app/work_chat_ui/**'
      - 'app/webapp/index.html'
      - 'tests/test_work_chat.py'
      - 'tests/work_chat_browser_check.py'
      - '.github/workflows/work-chat-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/work_chat_ui/chat.js
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/work_chat_browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-chat-browser
          path: qa-work-chat/
          retention-days: 7
