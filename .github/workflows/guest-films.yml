name: Guest portal and family films
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guest-films:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: 123456:CI_ONLY_DO_NOT_USE_FOR_TELEGRAM
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install chrome
      - run: python -m pytest -q tests/test_guest_portal.py tests/test_delivery.py
      - run: python tests/guest_portal_browser_check.py
