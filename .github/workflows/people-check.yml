name: People pilot UI
on:
  pull_request:
    paths: ['app/people.py', 'app/people_ui/**', 'app/webapp/index.html', 'tests/test_people.py', 'tests/people_browser_check.py', '.github/workflows/people-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/people_ui/people.js
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/people_browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: people-pilot-browser
          path: qa-people/
          retention-days: 7
